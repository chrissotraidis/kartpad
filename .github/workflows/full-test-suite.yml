name: Full test suite
# Every pull request runs the whole Python test suite. The other workflows run
# chosen files only, so a test outside their lists could break unnoticed (a
# 0.8.9 candidate did). See docs/RELEASE-CHECKLIST.md, behaviour check 1.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m pip install --quiet pytest
      - run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - name: Kotlin compiler jars for the Android touch-control tests
        run: |
          set -eu
          cache="$HOME/.gradle/caches/modules-2/files-2.1"
          for coordinate in \
            org.jetbrains.kotlin:kotlin-compiler-embeddable:2.2.21 \
            org.jetbrains.kotlin:kotlin-stdlib:2.2.21 \
            org.jetbrains:annotations:13.0 \
            org.jetbrains.kotlin:kotlin-reflect:2.2.0 \
            org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0; do
            IFS=: read -r group artifact version <<< "$coordinate"
            dir="$cache/$group/$artifact/$version/ci"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/$artifact-$version.jar" \
              "https://repo1.maven.org/maven2/${group//.//}/$artifact/$version/$artifact-$version.jar"
          done
      - name: Tests
        run: KARTPAD_TEST_JDK="$JAVA_HOME" python3 -B -m pytest -q -rs tests
