name: REL report build integrity
on:
  pull_request:
    paths:
      - 'scripts/*game-runtime.sh'
      - 'scripts/*game-app.sh'
      - 'scripts/translate-*.sh'
      - 'scripts/generate-g8-full-title.sh'
      - 'scripts/inject-retro-rel-report-guard.py'
      - 'vendor/runtimes/**'
      - 'vendor/wiicompiled/**'
      - '.gitmodules'
      - 'scripts/stage-maintained-runtime.py'
      - 'scripts/stage-maintained-translator.py'
      - 'scripts/prepare-patched-translator.sh'
      - 'scripts/write-build-provenance.py'
      - 'scripts/package-release-source.py'
      - 'scripts/package-coordinated-source.py'
      - 'tests/test_coordinated_source.py'
      - 'scripts/package-coordinated-assets.py'
      - 'tests/test_coordinated_assets.py'
      - 'scripts/restore-source-git.py'
      - 'dependencies.lock.json'
      - 'tests/runtime_sources.py'
      - 'tests/test_maintained_runtime_staging.py'
      - 'tests/test_maintained_translator_staging.py'
      - 'tests/test_build_provenance.py'
      - 'tests/test_source_submodule_inputs.py'
      - 'builder/**'
      - 'tests/test_retro_rel_report_guard.py'
      - 'tests/fixtures/rel_report/**'
      - '.github/workflows/rel-report-guard.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*game-runtime.sh'
      - 'scripts/*game-app.sh'
      - 'scripts/translate-*.sh'
      - 'scripts/generate-g8-full-title.sh'
      - 'scripts/inject-retro-rel-report-guard.py'
      - 'vendor/runtimes/**'
      - 'vendor/wiicompiled/**'
      - '.gitmodules'
      - 'scripts/stage-maintained-runtime.py'
      - 'scripts/stage-maintained-translator.py'
      - 'scripts/prepare-patched-translator.sh'
      - 'scripts/write-build-provenance.py'
      - 'scripts/package-release-source.py'
      - 'scripts/package-coordinated-source.py'
      - 'tests/test_coordinated_source.py'
      - 'scripts/package-coordinated-assets.py'
      - 'tests/test_coordinated_assets.py'
      - 'scripts/restore-source-git.py'
      - 'dependencies.lock.json'
      - 'tests/runtime_sources.py'
      - 'tests/test_maintained_runtime_staging.py'
      - 'tests/test_maintained_translator_staging.py'
      - 'tests/test_build_provenance.py'
      - 'tests/test_source_submodule_inputs.py'
      - 'builder/**'
      - 'tests/test_retro_rel_report_guard.py'
      - 'tests/fixtures/rel_report/**'
      - '.github/workflows/rel-report-guard.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and exercise report control flow with sanitizers
        env:
          CXX: clang++
        run: python3 -B -m unittest discover -s tests -p 'test_retro_rel_report_guard.py' -v
      - name: Builder integration
        run: bash scripts/test-kartpad-builder.sh
      - name: Pinned source, staging, and offline source restoration
        env:
          PYTHONPATH: builder
        run: |
          python3 -B -m unittest discover -s tests -p 'test_source_submodule_inputs.py' -v
          python3 -B -m unittest discover -s tests -p 'test_maintained_runtime_staging.py' -v
          python3 -B -m unittest discover -s tests -p 'test_maintained_translator_staging.py' -v
          python3 -B -m unittest discover -s tests -p 'test_build_provenance.py' -v
          python3 -B -m unittest discover -s tests -p 'test_coordinated_*.py' -v
