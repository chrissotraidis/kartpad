name: KartPad app or platform problem
description: KartPad installation, app UI, platform integration, or a problem whose owner is unclear.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve KartPad. Please check [where to report and follow up](https://github.com/chrissotraidis/kartpad/blob/main/docs/REPORTING.md) and the [support guide](https://github.com/chrissotraidis/kartpad/blob/main/docs/SUPPORT.md) first. If this is an existing report, add your results there.
        For a suspected WiiCompiled runtime problem, you can [report directly upstream](https://github.com/patchzyy/Wiicompiled/issues/new/choose). Identify your modified KartPad build and follow that form honestly. Keep app/platform problems and uncertain cases here.
        Reports are public. Attach only reviewed diagnostic text and screenshots; never game data, saves, NAND, identities, keys, or a raw private diagnostics ZIP.
  - type: input
    id: revision
    attributes:
      label: KartPad version and build
      placeholder: e.g. 0.4.11 build 26, or 0.4.12-android.2 build 23
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Device and OS version
      description: Include the device model and exact OS version. Android reports should include the One UI version if applicable. No serial numbers or MAC addresses.
      placeholder: e.g. iPhone 15 Pro Max, iOS version; Galaxy S24 Ultra, Android/One UI version
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: What did you expect, and what happened instead? Include any exact error message.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Steps and game context
      description: Include Original or Retro Rewind (and version), mode, track, and controller. For display issues, include connection type and which screen fails.
  - type: input
    id: frequency
    attributes:
      label: How often does it happen?
      placeholder: Every launch, after several minutes, only on the first lap, etc.
  - type: textarea
    id: performance-profile
    attributes:
      label: Display and performance settings
      description: Render resolution, aspect mode, Renderer Validation On/Off on Android, FPS before/during the problem, cold or repeat race, battery/game mode, and charging state if relevant.
  - type: input
    id: report-id
    attributes:
      label: In-app report ID (if available)
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostics and screenshots
      description: "A diagnostic file is the fastest way to a fix. Android: on the game chooser tap Help → Export Private Diagnostics…, pick the session that had the problem, and drag the ZIP in here. iPhone/iPad: ••• → Report a Problem…. Mac: Help → Report a Problem…. For graphics problems, add a screenshot or short video. Nothing is attached automatically."
  - type: input
    id: related-report
    attributes:
      label: Related report (if known)
      description: Optional link to an existing KartPad or WiiCompiled issue. If you also report upstream, say that you use a modified KartPad build and cross-link both reports.
