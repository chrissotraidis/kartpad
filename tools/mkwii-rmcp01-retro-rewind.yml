schema_version: 1
workspace_root: ..

project:
  id: kartpad-mkwii-rmcp01-retro-rewind
  display_name: KartPad Mario Kart Wii PAL with Retro Rewind
  game_id: RMCP01
  region: P
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: mkwii_base

memory:
  base: 0x80000000
  size: 0x01A00000
  sda_base: 0x8038CC00
  sda2_base: 0x8038EFA0

inputs:
  dol:
    path: private/self-build/disc/sys/main.dol
    sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
  rel:
    path: private/self-build/disc/files/rel/StaticR.rel
    load_address: 0x805102E0
    sha256: 16d9d146112541fefea701ecb5bc1a496f9d50e4a752fbb5b6778e7c6399f67d

translation:
  entry_points:
    - 0x800060A4
  function_map:
    path: ref/upstream/Wiicompiled/projects/mkwii/MAP.txt
  allow_unsupported_instructions: false

runtime:
  native_registration_root: build/wiicompiled-fpscr/runtime/src
  native_abi_directories:
    - build/wiicompiled-fpscr/runtime/src/hle/gx

output:
  root: private/self-build/retro-rewind/translation
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: base/mkwii_base_manifest.json

profiles:
  retro-rewind:
    enabled: true
    requires_game_id: RMCP01
    requires_dol_sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
    # translate-retro-rewind.sh stages the exact selected Code.pul here before
    # translating the base. Every translation phase must see the same patch
    # set or leaf inlining can silently bypass Retro Rewind hooks.
    code_pul: private/self-build/retro-rewind/input/Binaries/Code.pul
    mod_root: private/self-build/retro-rewind/input
    region: P
    module_guest_base: 0x81800000
    module_link_base: 0x803992E0
    output: private/self-build/retro-rewind/mod
    enable_retro_wfc: true
    retro_wfc_legacy_bootstrap_hook: 0x800ED6E8
    riivolution:
      xml: xml/RetroRewind6.xml
      options:
        - section: Retro Rewind
          option: Pack
          choice: 1
        # RR Music lays RetroRewind6/MyStuff over the music folder. It maps
        # nothing until a player adds .brstm files there (#441).
        - section: Retro Rewind
          option: My Stuff
          choice: 4
    # The build script always overrides this with an explicit local payload or
    # the diagnostic-only --skip-retro-wfc flag. Keeping the manifest offline
    # prevents translation from silently downloading production server data.
    retro_wfc_payload: private/self-build/retro-rewind/payload.bin
